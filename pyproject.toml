[project]
name = "vectorial-refocusing"
version = "0.1.0"
description = "Vectorial optical-field refocusing with the Khadir angular-spectrum model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jax[cuda13]>=0.11.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
